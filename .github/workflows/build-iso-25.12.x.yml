# 此工作流是为了构建一个immortalwrt固件的安装器 格式为iso 可用于所有的虚拟机 和 物理机
# 所谓安装器就是用来安装用的 iso引导的是一个启动速度极快的debian live系统 跑码后输入命令 ddd 即可调出安装菜单
# 安装时 若是多张硬盘 你可以选择 需要安装的硬盘 此类方法安装的openwrt 安装后是有剩余空间的 更多信息请参考 wukongdaily/img-installer 项目
# 几乎所有linux 都有各自的安装器 唯独openwrt和armbian 没有, 希望此工作流 弥补这个遗憾 让你更优雅的 安装openwrt 

name: Build 25.12.x ISO x86-64

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
      profile:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build_immortalwrt:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x "${{ github.workspace }}/x86-64/build25.sh"
      
      - name: Validate PPPoE Inputs
        env:
          ENABLE_PPPOE: ${{ inputs.enable_pppoe }}
          PPPOE_ACCOUNT: ${{ inputs.pppoe_account }}
          PPPOE_PASSWORD: ${{ inputs.pppoe_password }}
        run: |
          set -euo pipefail
          if [[ "$ENABLE_PPPOE" == "yes" ]]; then
            if [[ -z "$PPPOE_ACCOUNT" || -z "$PPPOE_PASSWORD" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi
      - name: Enable Store integration
        env:
          ENABLE_STORE: ${{ inputs.enable_store }}
        run: |
          set -euo pipefail
          if [[ "$ENABLE_STORE" == "true" ]]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: ✅ 正在构建ImmortalWrt固件25.12.x
        env:
          PROFILE_INPUT: ${{ inputs.profile }}
          INCLUDE_DOCKER: ${{ inputs.include_docker }}
          LUCI_VERSION: ${{ inputs.luci_version }}
          ENABLE_PPPOE: ${{ inputs.enable_pppoe }}
          PPPOE_ACCOUNT: ${{ inputs.pppoe_account }}
          PPPOE_PASSWORD: ${{ inputs.pppoe_password }}
        run: |
          set -Eeuo pipefail
          case "$PROFILE_INPUT" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
            *)
              echo "Error: unsupported profile: $PROFILE_INPUT" >&2
              exit 1
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> "$GITHUB_ENV"
          image="immortalwrt/imagebuilder:x86-64-openwrt-${LUCI_VERSION}"
          mkdir -p "${{ github.workspace }}/bin" "${{ github.workspace }}/files" "${{ github.workspace }}/custom"
          echo "Building $image with rootfs size: ${ROOTFS_SIZE} MB"
          # ImageBuilder 镜像已经携带与 LUCI_VERSION 对应的 .config；
          # 不要覆盖它，否则会把 25.12.1 混成仓库里遗留的 25.12.0-rc1 配置。
          docker run --rm -i \
            --user root \
            --workdir /home/build/immortalwrt \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -e "PROFILE=$ROOTFS_SIZE" \
            -e "INCLUDE_DOCKER=$INCLUDE_DOCKER" \
            -e "ENABLE_PPPOE=$ENABLE_PPPOE" \
            -e "PPPOE_ACCOUNT=$PPPOE_ACCOUNT" \
            -e "PPPOE_PASSWORD=$PPPOE_PASSWORD" \
          "$image" /bin/bash /home/build/immortalwrt/build.sh

      - name: Verify x86-64 EFI firmware output
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          images=("${{ github.workspace }}"/bin/targets/x86/64/*squashfs-combined-efi.img.gz)
          if (( ${#images[@]} != 1 )); then
            echo "Error: expected exactly one squashfs EFI image, found ${#images[@]}." >&2
            printf '%s\n' "${images[@]}" >&2
            exit 1
          fi
          ls -lh "${images[0]}"

      - name: ✅ 复制固件到根目录
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          images=("${{ github.workspace }}"/bin/targets/x86/64/*squashfs-combined-efi.img.gz)
          cp "${images[0]}" "${{ github.workspace }}/"

      - name: ✅ 上传固件到 artifact (for ISO generation)
        uses: actions/upload-artifact@v6
        with:
          name: firmware-img
          path: |
            *.img.gz

  build_installer_iso:
    runs-on: ubuntu-22.04
    needs: build_immortalwrt

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v7
        with:
          name: firmware-img

      - name: ⏬ 同步 img-installer 项目 准备制作ISO
        run: |
          set -Eeuo pipefail
          git clone --depth=1 https://github.com/wukongdaily/img-installer.git
          cd img-installer
          # 固定已验证的上游版本，避免 Debian Live 构建脚本随 master 漂移。
          git fetch --depth=1 origin 361ea6138094a2417e62edd01f73fa1160e93e01
          git checkout --detach 361ea6138094a2417e62edd01f73fa1160e93e01
          git log -1 --oneline

      - name: Set executable permissions for scripts
        run: |
          chmod +x "${{ github.workspace }}/img-installer/custom.sh"
          chmod +x "${{ github.workspace }}/img-installer/supportFiles/custom/build.sh"

      - name: ✅ 制作 25.12.x ISO
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          firmware_files=("${{ github.workspace }}"/*squashfs-combined-efi.img.gz)
          if (( ${#firmware_files[@]} != 1 )); then
            echo "Error: expected exactly one EFI firmware archive, found ${#firmware_files[@]}." >&2
            printf '%s\n' "${firmware_files[@]}" >&2
            exit 1
          fi
          firmware_file="${firmware_files[0]##*/}"
          cd img-installer
          bash autobuild/autobuild.sh "../$firmware_file"
          test -s output/custom-installer-x86_64.iso

      - name: Verify PVE bootable ISO
        run: |
          set -Eeuo pipefail
          iso="${{ github.workspace }}/img-installer/output/custom-installer-x86_64.iso"
          test -s "$iso"
          file "$iso"
          file "$iso" | grep -q "ISO 9660"
          ls -lh "$iso"

      - name: Upload PVE ISO artifact
        uses: actions/upload-artifact@v6
        with:
          name: immortalwrt-25.12-x86-64-pve-iso
          path: img-installer/output/custom-installer-x86_64.iso
          if-no-files-found: error

      - name: 🚀 上传 ISO 到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "Custom-Installer-x86_64-ISO"
          body_path: "${{ github.workspace }}/img-installer/autobuild/info.md"
          files: |
            img-installer/output/custom-installer-x86_64.iso
          token: "${{ secrets.GITHUB_TOKEN }}"
