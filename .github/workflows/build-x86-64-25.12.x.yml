name: Build 25.12.x x86-64
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "ImmortalWrt版本（latest自动选择最新稳定版，也可填写例如25.12.1）"
        required: false
        default: "latest"
        type: string
      custom_router_ip:
        description: "请设置路由器的管理地址(仅对多网口路由器有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
      profile:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build25.sh

      - name: Save Custom Router IP into OpenWrt files
        env:
          CUSTOM_ROUTER_IP: ${{ inputs.custom_router_ip }}
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/custom"
          printf '%s\n' "$CUSTOM_ROUTER_IP" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的路由器管理地址是:$CUSTOM_ROUTER_IP"
          # 后续步骤会将该文件映射到路由器/etc/config/custom_router_ip.txt 以便用于开机脚本99-custom.sh读取用户设置的ip
      
      - name: Validate PPPoE Inputs
        env:
          ENABLE_PPPOE: ${{ inputs.enable_pppoe }}
          PPPOE_ACCOUNT: ${{ inputs.pppoe_account }}
          PPPOE_PASSWORD: ${{ inputs.pppoe_password }}
        run: |
          set -euo pipefail
          if [[ "$ENABLE_PPPOE" == "yes" ]]; then
            if [[ -z "$PPPOE_ACCOUNT" || -z "$PPPOE_PASSWORD" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi
      
      - name: Enable Store integration
        env:
          ENABLE_STORE: ${{ inputs.enable_store }}
        run: |
          set -euo pipefail
          if [[ "$ENABLE_STORE" == "true" ]]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Resolve ImmortalWrt ImageBuilder version
        env:
          REQUESTED_VERSION: ${{ inputs.luci_version }}
          IMAGEBUILDER_TARGET: x86-64
        run: bash shell/resolve-imagebuilder-version.sh

      - name: Build ImmortalWrt-x86-64-efi 25.12.x
        env:
          PROFILE_INPUT: ${{ inputs.profile }}
          INCLUDE_DOCKER: ${{ inputs.include_docker }}
          ENABLE_PPPOE: ${{ inputs.enable_pppoe }}
          PPPOE_ACCOUNT: ${{ inputs.pppoe_account }}
          PPPOE_PASSWORD: ${{ inputs.pppoe_password }}
        run: |
          set -Eeuo pipefail
          case "$PROFILE_INPUT" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
            *)
              echo "Error: unsupported profile: $PROFILE_INPUT" >&2
              exit 1
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> "$GITHUB_ENV"
          image="${IMAGEBUILDER_IMAGE}"
          mkdir -p "${{ github.workspace }}/bin" "${{ github.workspace }}/files" "${{ github.workspace }}/custom"
          echo "Building $image with rootfs size: ${ROOTFS_SIZE} MB"
          # ImageBuilder 镜像已经携带与解析版本对应的 .config；不要覆盖它。
          docker run --rm -i \
            --user root \
            --workdir /home/build/immortalwrt \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -e "PROFILE=$ROOTFS_SIZE" \
            -e "INCLUDE_DOCKER=$INCLUDE_DOCKER" \
            -e "ENABLE_PPPOE=$ENABLE_PPPOE" \
            -e "PPPOE_ACCOUNT=$PPPOE_ACCOUNT" \
            -e "PPPOE_PASSWORD=$PPPOE_PASSWORD" \
          "$image" /bin/bash /home/build/immortalwrt/build.sh

      - name: Verify x86-64 image output
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          images=("${{ github.workspace }}"/bin/targets/x86/64/*squashfs-combined-efi.img.gz)
          if (( ${#images[@]} != 1 )); then
            echo "Error: expected exactly one squashfs EFI image, found ${#images[@]}." >&2
            printf '%s\n' "${images[@]}" >&2
            exit 1
          fi
          ls -lh "${images[0]}"
          renamed="${{ github.workspace }}/bin/targets/x86/64/immortalwrt_${LUCI_VERSION}_x86-64-efi.img.gz"
          mv "${images[0]}" "$renamed"
          echo "Renamed firmware to $(basename "$renamed")"
          

      - name: Create info
        env:
          CUSTOM_ROUTER_IP: ${{ inputs.custom_router_ip }}
          INCLUDE_DOCKER: ${{ inputs.include_docker }}
        run: |
          set -euo pipefail
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息
          <a href="https://wkdaily.cpolar.cn/archives/1">
           <img src="https://img.shields.io/badge/若下载慢可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
          </a>
          
          - 🏠 **后台地址**: $CUSTOM_ROUTER_IP
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF

          if [[ "$INCLUDE_DOCKER" == "yes" ]]; then
            extra_content="#### 默认带docker"
            echo -e "\n$extra_content" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/router-info.md
          fi

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/immortalwrt_*_x86-64-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
